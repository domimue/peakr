# Plan → Calendar: move a workout to another day by drag & drop (Phase 5; a view of the Plan tab
# since Phase 5c).
#
# Runs against a development build (the plan comes from Profile → Plan preview → "Use as my plan",
# which only exists in __DEV__ builds) with Metro running:
#   pnpm --filter @peakr/mobile start
#   maestro test apps/mobile/.maestro/plan-drag-drop.yaml
# On a physical device pass the Metro URL: maestro test -e METRO_URL=http://<lan-ip>:8081 ...
appId: com.peakr.app
name: Plan – drag a workout to another day
tags:
  - plan
env:
  METRO_URL: http://10.0.2.2:8081
---
- launchApp:
    clearState: true
# After clearState the dev launcher asks for nearby devices (server discovery) – not needed.
- extendedWaitUntil:
    visible: Don.t allow
    timeout: 15000
    optional: true
- tapOn:
    text: Don.t allow
    optional: true
# The dev client registers its own scheme (exp+<app scheme>).
- openLink: exp+peakr://expo-development-client/?url=${encodeURIComponent(METRO_URL)}
# After clearState the dev client explains its developer menu once (covers the app).
- extendedWaitUntil:
    visible: Continue
    timeout: 120000
    optional: true
- tapOn:
    text: Continue
    optional: true
# …and then leaves the developer menu open.
- tapOn:
    text: Close
    optional: true
- extendedWaitUntil:
    visible: Today
    timeout: 60000

# Create a plan from the half-marathon preset; it starts on the next Monday (or today).
- tapOn: Profile
- scrollUntilVisible:
    element: Plan preview \(dev\)
- tapOn: Plan preview \(dev\)
- tapOn: Use as my plan
# The preview opens Plan → Calendar; select both anyway in case the tab bar kept another tab.
- tapOn: Plan
- tapOn: Calendar
- extendedWaitUntil:
    visible:
      id: plan-card-0-0
    timeout: 10000
- assertVisible: Week 1 of .*

# Drag Monday's workout by its handle down the week; a drop below the list lands on Sunday,
# which already has a session – so a warning appears.
- swipe:
    from:
      id: plan-card-0-0-handle
    direction: DOWN
    duration: 1500
- assertVisible: Moved to .*

# The move always stands; broken rules are only warnings that can be closed.
- assertVisible:
    id: move-feedback
- tapOn: Keep it as it is
- assertNotVisible:
    id: move-feedback
