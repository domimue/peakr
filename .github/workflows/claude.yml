# Lets you hand Claude a task from GitHub: mention @claude in an issue,
# a PR comment or a review. Claude reads CLAUDE.md, does the work on a
# branch and answers in the thread.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and
# variables → Actions), created with `claude setup-token`. Runs count against
# the Claude Pro/Max plan; no API key is used.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only people with write access can start a run, so strangers on a
    # public repo cannot spend the token.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(pnpm:*),Bash(node:*),Bash(git:*),Bash(ls:*),Bash(cat:*)"
            --append-system-prompt "Run pnpm lint && pnpm typecheck && pnpm test before pushing, as CLAUDE.md requires."
