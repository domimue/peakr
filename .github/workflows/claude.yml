# Lets you hand Claude a task from GitHub: mention @claude in an issue,
# a PR comment or a review. Claude reads CLAUDE.md, does the work on a
# branch and answers in the thread.
#
# The issue/PR gets the label `claude-queue` while the task is open. If a run
# stops early (e.g. the Claude usage limit is used up), claude-resume.yml
# continues it every hour until Claude removes the label.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and
# variables → Actions), created with `claude setup-token`. Runs count against
# the Claude Pro/Max plan; no API key is used.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only people with write access can start a run, so strangers on a
    # public repo cannot spend the token.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ITEM: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: Mark as queued
        run: |
          gh label create claude-queue --repo "$GITHUB_REPOSITORY" --color FFB020 \
            --description "Open task for Claude; resumed hourly until done" --force
          gh api "repos/$GITHUB_REPOSITORY/issues/$ITEM/labels" -f "labels[]=claude-queue" > /dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(pnpm:*),Bash(node:*),Bash(git:*),Bash(gh:*),Bash(ls:*),Bash(cat:*),WebFetch,WebSearch"
            --append-system-prompt "Follow CLAUDE.md. Commit and push in small steps so nothing is lost if the run stops. Run pnpm lint && pnpm typecheck && pnpm test before the final push. For an issue, open the PR yourself with gh pr create and 'Closes #${{ env.ITEM }}'. When the task is complete, or you need a decision from the user, remove the queue label: gh api -X DELETE repos/${{ github.repository }}/issues/${{ env.ITEM }}/labels/claude-queue. Leave it while work remains. When you finish or stop to ask something, also post a NEW comment with gh issue comment ${{ env.ITEM }} that starts with @${{ github.repository_owner }} and holds the result or the question; edits of your progress comment send no notification."
